
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <meta name="theme-color" content="#152d4d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expense Tracker">

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
    <header>
        <h1>💰 Expense Tracker</h1>
        <p>Manage your money smartly</p>
    </header>

    <main class="container">
        <section class="summary">
            <div class="card">
                <h3>Total Income</h3>
                <p id="income">₹0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">₹0.00</p>
            </div>
            <div class="card">
                <h3>Balance</h3>
                <p id="balance">₹0.00</p>
            </div>
        </section>

        <section class="panel">
            <h2>Add Transaction</h2>

            <form id="expenseForm">
                <label for="title">Transaction Name</label>
                <input type="text" id="title"
                       placeholder="e.g. Shopping" required>

                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount"
                       min="0.01" step="0.01"
                       placeholder="Enter amount" required>

                <label for="type">Transaction Type</label>
                <select id="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <label for="category">Category</label>
                <select id="category" required>
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Education</option>
                    <option>Bills</option>
                    <option>Salary</option>
                    <option>Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <button type="submit">Add Transaction</button>
            </form>
            <p id="message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Transaction History</h2>

            <div class="filters">
                <input type="search" id="search"
                       placeholder="Search transactions...">

                <select id="filterType">
                    <option value="all">All Transactions</option>
                    <option value="income">Income Only</option>
                    <option value="expense">Expenses Only</option>
                </select>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList"></tbody>
                </table>
            </div>

            <p id="emptyMessage">No transactions added yet.</p>

            <button id="exportBtn" type="button" class="export">
                Export to CSV
            </button>
        </section>
    </main>

    <footer>
        <p>Personal Expense Tracker | Student Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
